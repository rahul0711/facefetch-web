# Genesis Hub face search website on port 9006 (replaces the temporary
# KailVarn AR test site, whose config was moved to
# /etc/nginx/sites-available/kailvarn-ar-9006.disabled).
#
# Plain HTTP. Note: browsers only allow the live in-page camera on https or
# localhost, so on other devices the selfie step offers the phone's camera
# app / photo upload instead (the app handles this; search works the same).
#   everything      -> C# backend :5044 (API + the built React app + /uploads)
#   /api/analyze,   -> Python face engine :8002 (only the /lab tool calls these
#   /api/query         directly; the backend talks to the engine itself)
server {
    listen 9006;
    listen [::]:9006;
    server_name _;

    # Photo uploads (batches of several full-size photos) and Drive imports.
    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/(analyze|query)$ {
        proxy_pass https://127.0.0.1:8002;
        proxy_ssl_verify off; # the engine's own self-signed cert
    }

    location / {
        proxy_pass http://127.0.0.1:5044;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off; # stream uploads straight through
    }
}
